<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Get a Quote | CC Visual Works</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #071812;
      color: #FFFFFF;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVIGATION */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 20px 4.5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 24, 18, 0.94);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1.4px;
      white-space: nowrap;
    }

    .logo strong {
      color: #2F80FF;
    }

    .logo span {
      color: #FFFFFF;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      color: #E6ECE8;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #4A9BFF;
    }

    .quote-nav {
      padding: 10px 18px;
      border: 1px solid #2F80FF;
      border-radius: 4px;
      color: #FFFFFF !important;
    }

    .quote-nav:hover {
      background: #2F80FF;
    }

    /* QUOTE */

    .quote {
      min-height: 100vh;
      padding: 160px 4.6% 110px;
      background: #0B2118;
    }

    .section-label {
      color: #8FA59A;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: clamp(35px, 5vw, 65px);
      line-height: 1;
      margin-bottom: 35px;
      letter-spacing: -2px;
      color: #FFFFFF;
    }

    .quote-intro {
      max-width: 650px;
      color: #C4D0CA;
      font-size: 17px;
      margin-bottom: 45px;
    }

    .quote-form {
      max-width: 850px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      color: #C4D0CA;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #071812;
      color: #FFFFFF;
      border-radius: 4px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #2F80FF;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .form-group select option {
      background: #071812;
      color: #FFFFFF;
    }

    .btn {
      padding: 18px 32px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #2F80FF;
      display: inline-block;
      background: #2F80FF;
      color: #FFFFFF;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #4A9BFF;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      nav {
        padding: 18px 5%;
      }

      .nav-links {
        display: none;
      }

      .quote {
        padding: 130px 6% 80px;
      }

      .quote-form {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>

    <div class="logo">
      <strong>CC</strong> <span>VISUAL WORKS</span>
    </div>

    <ul class="nav-links">
      <li><a href="./">Home</a></li>
      <li><a href="./#about">About</a></li>
      <li><a href="./#services">Services</a></li>
      <li><a href="./#portfolio">Portfolio</a></li>
      <li><a href="partner.html">Partner</a></li>
      <li><a href="quote.html" class="quote-nav">Get a Quote</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

  </nav>


  <!-- GET A QUOTE -->

  <section class="quote">

    <div class="section-label">
      Get a Quote
    </div>

    <h1 class="section-title">
      Tell me about<br>
      your project.
    </h1>

    <p class="quote-intro">
      Tell me a little about what you need. I'll review your requirements
      and get back to you.
    </p>

    <form
      class="quote-form"
      action="mailto:ccvisualworks@gmail.com"
      method="post"
      enctype="text/plain"
    >

      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="Name"
          required
        >
      </div>

      <div class="form-group">
        <label for="business">Business / Company</label>
        <input
          type="text"
          id="business"
          name="Business"
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="Email"
          required
        >
      </div>

      <div class="form-group">
        <label for="service">Service Needed</label>

        <select id="service" name="Service">

          <option value="">Please select</option>

          <option>Video, Audio & Content Editing</option>
          <option>Website Design</option>
          <option>Visual Design</option>
          <option>E-commerce Support</option>
          <option>YouTube Subtitling</option>
          <option>AI-Assisted Creative Design</option>
          <option>Be a Partner</option>
          <option>Other</option>

        </select>
      </div>

      <div class="form-group">

        <label for="budget">
          Estimated Budget
        </label>

        <select id="budget" name="Budget">

          <option value="">Please select</option>
          <option>RM300 – RM500</option>
          <option>RM500 – RM1,000</option>
          <option>RM1,000 – RM2,000</option>
          <option>Not sure yet</option>

        </select>

      </div>

      <div class="form-group full">

        <label for="message">
          Tell me about your project
        </label>

        <textarea
          id="message"
          name="Project Details"
          placeholder="Tell me what you would like to create..."
          required
        ></textarea>

      </div>

      <div class="form-group full">

        <button
          type="submit"
          class="btn"
        >
          Submit Quote Request →
        </button>

      </div>

    </form>

  </section>

</body>
</html>
